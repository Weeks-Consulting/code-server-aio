[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
environment=HOME="/root",USER="root",LOGNAME="root"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[eventlistener:service-events]
command=/usr/bin/python3 -u /usr/local/lib/supervisor-events.py
events=PROCESS_STATE_FATAL
buffer_size=100
priority=1
autostart=true
autorestart=true
startsecs=0
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dockerd]
command=/usr/sbin/dockerd --host=unix:///var/run/docker.sock --group=docker
user=root
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:code-server]
command=/usr/bin/code-server --bind-addr 127.0.0.1:8081 --auth none /home/cloud-user
directory=/home/cloud-user
user=cloud-user
environment=HOME="/home/cloud-user",USER="cloud-user",LOGNAME="cloud-user"
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:haproxy]
command=/usr/sbin/haproxy -W -db -f /run/access-proxy/haproxy.cfg -p /run/access-proxy/haproxy.pid -S /run/access-proxy/master.sock,mode,600
user=root
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:access-keys]
command=/usr/bin/python3 -u /usr/local/lib/access-proxy.py
user=root
priority=40
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
