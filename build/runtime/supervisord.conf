[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
environment=HOME="/root",USER="root",LOGNAME="root",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[eventlistener:service-events]
command=/bin/bash /usr/local/lib/supervisor-events.sh
events=PROCESS_STATE_FATAL
buffer_size=100
priority=1
autorestart=true
startsecs=0
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dockerd]
command=/usr/sbin/dockerd --host=unix:///var/run/docker.sock --group=docker
priority=30
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:code-server]
command=/bin/bash /usr/local/lib/start-code-server.sh
directory=/
user=root
environment=HOME="/home/cloud-user",USER="cloud-user",LOGNAME="cloud-user",PATH="/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
priority=20
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:haproxy]
command=/usr/sbin/haproxy -W -db -f /run/access-proxy/haproxy.cfg -p /run/access-proxy/haproxy.pid -S /run/access-proxy/master.sock,mode,600
priority=10
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:access-keys]
command=/usr/bin/python3 -u /usr/local/lib/access-proxy.py
priority=40
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
