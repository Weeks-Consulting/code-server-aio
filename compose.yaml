services:
  code-server:
    image: ${CODE_SERVER_IMAGE:-ghcr.io/weeks-consulting/code-server-aio:latest}
    privileged: true
    init: true
    restart: unless-stopped
    stop_grace_period: 150s
    environment:
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      CF_ACCESS_ALLOWED_EMAILS: ${CF_ACCESS_ALLOWED_EMAILS:-}
      CF_ACCESS_ALLOWED_SERVICE_TOKENS: ${CF_ACCESS_ALLOWED_SERVICE_TOKENS:-}
    volumes:
      - code-server-home:/home
      - docker-data:/var/lib/docker
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/container-healthcheck"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?Set CF_TUNNEL_TOKEN in .env}
    depends_on:
      code-server:
        condition: service_started

volumes:
  code-server-home:
  docker-data:
