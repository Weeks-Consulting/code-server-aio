name: Build and publish container

on:
  pull_request:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate code-server version and release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = Path("build/code-server.version").read_text().strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("build/code-server.version must contain a version such as 4.141.0")
          expected = "v" + version
          tag = os.environ["RELEASE_TAG"]
          if tag and not re.fullmatch(re.escape(expected) + r"(?:-rc\.[1-9][0-9]*)?", tag):
              raise SystemExit(f"Release tag must be {expected} or {expected}-rc.N (N >= 1) to match build/code-server.version (got {tag})")
          print(f"Building code-server {version}" + (f" for release {tag}" if tag else ""))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - name: Derive image name from repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Check shell syntax and Compose configurations
        run: bash build/tests/check.sh
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name || steps.version.outputs.version }}
          load: true
          tags: ${{ steps.image.outputs.name }}:test
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Test JWT validation, error pages, key rotation, and WebSockets
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:test
        run: bash build/tests/proxy.sh "$TEST_IMAGE"
      - name: Test full startup, Homebrew persistence, health, and service recovery
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:test
        run: bash build/tests/smoke.sh "$TEST_IMAGE"
      - name: Test backup and restore without S3
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:test
        run: bash build/tests/backup-restore.sh "$TEST_IMAGE"

      - name: Push tested image on releases
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="$IMAGE:tested-${{ github.run_id }}-${{ github.run_attempt }}-$ARCH"
          docker tag "$IMAGE:test" "$tag"
          docker push "$tag"
          mkdir -p digests
          docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"' > "digests/$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'release' && github.event.action == 'published'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Derive image name from repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-rc.') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Publish tested manifests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] || args+=(--tag "$tag")
          done <<< "$TAGS"
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "digests/$arch")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
      - name: Published image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          printf '%s\n' "Published image: $IMAGE_NAME" \
            'Available image tags:' \
            "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"
