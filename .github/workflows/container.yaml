name: Build and publish container

on:
  # Documentation-only changes cannot affect the image, scripts, or tests.
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Rebuild and publish the latest stable release
        type: boolean
        default: false
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

concurrency:
  # PR and branch-push checks never publish, so newer commits supersede them.
  # Release, schedule, and manual runs must each reach completion.
  group: container-${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  source:
    name: Select source release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Latest-release rebuilds requested off the tag dispatch a run on the tag.
      actions: write
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
      dispatched: ${{ steps.source.outputs.dispatched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The local act wrapper already bind-mounts the working checkout.
        if: ${{ !env.ACT }}
        with:
          persist-credentials: false
      - name: Select source and publication mode
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_LATEST: ${{ inputs.publish_latest && 'true' || 'false' }}
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: bash build/ci/select-source.sh

  test:
    name: Test (${{ matrix.arch }})
    needs: source
    if: needs.source.outputs.dispatched != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The local act wrapper already bind-mounts the working checkout.
        if: ${{ !env.ACT }}
        with:
          persist-credentials: false
      - name: Validate code-server version and release tag
        id: version
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: python3 build/ci/release-version.py
      - name: Derive image name from repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install local runner test dependencies
        if: ${{ env.ACT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 gnupg
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The job summary still reports the build; skip the unused record artifact.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ needs.source.outputs.tag || steps.version.outputs.version }}
          load: true
          tags: ${{ steps.image.outputs.name }}:test
          pull: true
          no-cache: ${{ needs.source.outputs.publish == 'true' }}
          cache-from: ${{ !env.ACT && format('type=gha,scope=container-{0}', matrix.arch) || '' }}
          cache-to: ${{ !env.ACT && format('type=gha,mode=max,scope=container-{0}', matrix.arch) || '' }}
      - name: Test Envoy JWT validation, key rotation, WebSockets, and backend isolation
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:test
        run: sh build/tests/proxy.sh "$TEST_IMAGE"
      - name: Test full startup, Homebrew persistence, health, and service recovery
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:test
        run: sh build/tests/smoke.sh "$TEST_IMAGE"
      - name: Test local and RustFS S3 backup and restore
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:test
        run: |
          sh build/tests/backup-restore.sh "$TEST_IMAGE"
          sh build/tests/backup-s3.sh "$TEST_IMAGE"

      - name: Export tested image for publishing
        if: needs.source.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          mkdir -p tested-image
          # Export the exact tested image with compressed layers and its manifest
          # digest. This job has no registry credentials or package write access.
          skopeo copy --dest-compress --digestfile tested-image/digest \
            "docker-daemon:$IMAGE:test" dir:tested-image/image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.source.outputs.publish == 'true'
        with:
          name: tested-image-${{ matrix.arch }}
          path: tested-image/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  check-host:
    name: Host scripts (${{ matrix.host }} sh)
    needs: source
    if: needs.source.outputs.dispatched != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Debian
            runner: ubuntu-24.04
            container-image: debian:13-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
          - host: macOS
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    # macOS runs on the host; Debian retains its pinned userland and /bin/sh.
    container: ${{ matrix.container-image }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host check dependencies
        run: sh build/tests/install-host-deps.sh
      - name: Check dependency pins, shell syntax, and Compose configurations
        run: sh build/tests/check.sh

  publish:
    name: Publish multi-platform image
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
      # Keep the shared staging tag serialized without displacing pending publishes.
      queue: max
    needs: [source, test, check-host]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive image name from repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tested-image-*
          path: tested-images
      - name: Push tested images by digest and stage their manifest
        id: manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REGISTRY_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          bash build/ci/stage-images.sh "$IMAGE" tested-images
      - name: Attest staged image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Publish attested image tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: bash build/ci/publish-tags.sh

  release-assets:
    name: Publish installer and deployment checksums
    needs: [source, publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate deployment checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          sha256sum compose.yaml compose.backup-common.yaml compose.backup.yaml compose.backup-local.yaml .env.example \
            manage manage.py build/tools/install.sh build/tools/restore-home.sh build/tools/backup-key.py > SHA256SUMS
      - name: Attest deployment checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: SHA256SUMS
      - name: Attach release installer and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" build/tools/install.sh manage.py SHA256SUMS --clobber
