name: Build and publish container

on:
  pull_request:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Rebuild and publish the latest stable release
        type: boolean
        default: false
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Select source release
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
      rebuild: ${{ steps.source.outputs.rebuild }}
    steps:
      - name: Select source and publication mode
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_LATEST: ${{ inputs.publish_latest && 'true' || 'false' }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          ref="$SOURCE_SHA"
          tag="$RELEASE_TAG"
          publish=false
          rebuild=false
          if [[ "$EVENT_NAME" == schedule || ( "$EVENT_NAME" == workflow_dispatch && "$PUBLISH_LATEST" == true ) ]]; then
            publish=true
            rebuild=true
            tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[1-9][0-9]*)?$ ]] || {
              echo "Latest stable release must use a vX.Y.Z or vX.Y.Z-N tag (N >= 1); got: $tag" >&2
              exit 1
            }
            ref="refs/tags/$tag"
          elif [[ "$EVENT_NAME" == release ]]; then
            publish=true
          fi
          printf 'ref=%s\ntag=%s\npublish=%s\nrebuild=%s\n' "$ref" "$tag" "$publish" "$rebuild" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.arch }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The local act wrapper already bind-mounts the working checkout.
        if: ${{ !env.ACT }}
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false
      - name: Validate code-server version and release tag
        id: version
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path("build/versions.json").read_text())["packages"]["code-server"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("build/versions.json must contain a version such as 4.141.0")
          expected = "v" + version
          tag = os.environ["RELEASE_TAG"]
          if tag and not re.fullmatch(re.escape(expected) + r"(?:-[1-9][0-9]*)?", tag):
              raise SystemExit(f"Release tag must be {expected} or {expected}-N (N >= 1) to match build/versions.json (got {tag})")
          print(f"Building code-server {version}" + (f" for release {tag}" if tag else ""))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - name: Derive image name from repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install local runner test dependencies
        if: ${{ env.ACT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck python3 gnupg
      - name: Check shell syntax and Compose configurations
        run: sh build/tests/check.sh
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ needs.source.outputs.tag || steps.version.outputs.version }}
          load: true
          tags: ${{ steps.image.outputs.name }}:test
          pull: true
          no-cache: ${{ needs.source.outputs.publish == 'true' }}
          cache-from: ${{ !env.ACT && format('type=gha,scope=container-{0}', matrix.arch) || '' }}
          cache-to: ${{ !env.ACT && format('type=gha,mode=max,scope=container-{0}', matrix.arch) || '' }}
      - name: Test Envoy JWT validation, key rotation, WebSockets, and backend isolation
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:test
        run: sh build/tests/proxy.sh "$TEST_IMAGE"
      - name: Test full startup, Homebrew persistence, health, and service recovery
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:test
        run: sh build/tests/smoke.sh "$TEST_IMAGE"
      - name: Test local and RustFS S3 backup and restore
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:test
        run: |
          sh build/tests/backup-restore.sh "$TEST_IMAGE"
          sh build/tests/backup-s3.sh "$TEST_IMAGE"

      - name: Export tested image for publishing
        if: needs.source.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          mkdir -p tested-image
          # Export the exact tested image with compressed layers and its manifest
          # digest. This job has no registry credentials or package write access.
          skopeo copy --dest-compress --digestfile tested-image/digest \
            "docker-daemon:$IMAGE:test" dir:tested-image/image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.source.outputs.publish == 'true'
        with:
          name: tested-image-${{ matrix.arch }}
          path: tested-image/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  check-debian:
    name: Host scripts (Debian sh)
    needs: source
    runs-on: ubuntu-24.04
    container: debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false
      - name: Install host check dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash python3 shellcheck docker-cli docker-compose
      - name: Check host scripts with Debian sh
        run: sh build/tests/check.sh

  check-macos:
    name: Host scripts (macOS sh)
    needs: source
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false
      - name: Install host check dependencies
        run: |
          brew install python shellcheck docker docker-compose
          mkdir -p "$RUNNER_TEMP/docker-config/cli-plugins"
          ln -s "$(brew --prefix)/bin/docker-compose" "$RUNNER_TEMP/docker-config/cli-plugins/docker-compose"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - name: Check host scripts with macOS sh
        run: sh build/tests/check.sh

  push:
    name: Push tested image (${{ matrix.arch }})
    needs: [source, test, check-debian, check-macos]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image-${{ matrix.arch }}
          path: tested-image
      - name: Push tested image by digest
        env:
          REPOSITORY: ${{ github.repository }}
          ARCH: ${{ matrix.arch }}
          REGISTRY_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          image="ghcr.io/${REPOSITORY,,}"
          digest=$(cat tested-image/digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$(skopeo manifest-digest tested-image/image/manifest.json)" == "$digest" ]]
          staging=$(mktemp -d)
          trap 'rm -rf -- "$staging"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$staging/auth.json" \
            ghcr.io -u "$REGISTRY_USER" --password-stdin
          mkdir -p digests
          skopeo copy --preserve-digests --authfile "$staging/auth.json" \
            --digestfile "digests/$ARCH" dir:tested-image/image "docker://$image@$digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    needs: [source, push]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false
      - name: Derive image name from repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Stage tested manifests
        id: manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          STAGING_TAG: staging-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "digests/$arch")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --metadata-file manifest-metadata.json --tag "$IMAGE:$STAGING_TAG" "${sources[@]}"
          digest=$(jq -r '."containerimage.descriptor".digest' manifest-metadata.json)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest staged image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Publish attested image tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          args=(--tag "$IMAGE:${RELEASE_TAG#v}")
          if [[ "$PRERELEASE" != true ]]; then
            latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
            if [[ "$latest" == "$RELEASE_TAG" ]]; then
              args+=(--tag "$IMAGE:latest")
            fi
          fi
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          printf 'Published attested image: %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  release-assets:
    name: Publish installer and deployment checksums
    needs: [source, test, check-debian, check-macos]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false
      - name: Generate deployment checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          sha256sum compose.yaml compose.backup-common.yaml compose.backup.yaml compose.backup-local.yaml .env.example \
            manage manage.py build/tools/install.sh build/tools/restore-home.sh build/tools/backup-key.py > SHA256SUMS
      - name: Attest deployment checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: SHA256SUMS
      - name: Attach release installer and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" build/tools/install.sh manage.py SHA256SUMS --clobber
