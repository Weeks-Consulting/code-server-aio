name: Build and publish container

on:
  pull_request:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Rebuild and publish the latest stable release
        type: boolean
        default: false
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Select source release
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
      rebuild: ${{ steps.source.outputs.rebuild }}
    steps:
      - name: Select source and publication mode
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_LATEST: ${{ inputs.publish_latest && 'true' || 'false' }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          ref="$SOURCE_SHA"
          tag="$RELEASE_TAG"
          publish=false
          rebuild=false
          if [[ "$EVENT_NAME" == schedule || ( "$EVENT_NAME" == workflow_dispatch && "$PUBLISH_LATEST" == true ) ]]; then
            publish=true
            rebuild=true
            tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[1-9][0-9]*)?$ ]] || {
              echo "Latest stable release must use a vX.Y.Z or vX.Y.Z-N tag (N >= 1); got: $tag" >&2
              exit 1
            }
            ref="refs/tags/$tag"
          elif [[ "$EVENT_NAME" == release ]]; then
            publish=true
          fi
          printf 'ref=%s\ntag=%s\npublish=%s\nrebuild=%s\n' "$ref" "$tag" "$publish" "$rebuild" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.arch }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        # The local act wrapper already bind-mounts the working checkout.
        if: ${{ !env.ACT }}
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false
      - name: Validate code-server version and release tag
        id: version
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = Path("build/code-server.version").read_text().strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("build/code-server.version must contain a version such as 4.141.0")
          expected = "v" + version
          tag = os.environ["RELEASE_TAG"]
          if tag and not re.fullmatch(re.escape(expected) + r"(?:-[1-9][0-9]*)?", tag):
              raise SystemExit(f"Release tag must be {expected} or {expected}-N (N >= 1) to match build/code-server.version (got {tag})")
          print(f"Building code-server {version}" + (f" for release {tag}" if tag else ""))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - name: Derive image name from repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Install local runner test dependencies
        if: ${{ env.ACT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck python3 gnupg
      - name: Check shell syntax and Compose configurations
        run: sh build/tests/check.sh
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ needs.source.outputs.tag || steps.version.outputs.version }}
          load: true
          tags: ${{ steps.image.outputs.name }}:test
          pull: true
          no-cache: ${{ needs.source.outputs.rebuild == 'true' }}
          cache-from: ${{ !env.ACT && format('type=gha,scope=container-{0}', matrix.arch) || '' }}
          cache-to: ${{ !env.ACT && format('type=gha,mode=max,scope=container-{0}', matrix.arch) || '' }}
      - name: Test JWT validation, error pages, key rotation, and WebSockets
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:test
        run: sh build/tests/proxy.sh "$TEST_IMAGE"
      - name: Test full startup, Homebrew persistence, health, and service recovery
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:test
        run: sh build/tests/smoke.sh "$TEST_IMAGE"
      - name: Test backup and restore without S3
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:test
        run: sh build/tests/backup-restore.sh "$TEST_IMAGE"

      - name: Export tested image for publishing
        if: needs.source.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          mkdir -p tested-image
          # Export the exact tested image with compressed layers and its manifest
          # digest. This job has no registry credentials or package write access.
          skopeo copy --dest-compress --digestfile tested-image/digest \
            "docker-daemon:$IMAGE:test" dir:tested-image/image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.source.outputs.publish == 'true'
        with:
          name: tested-image-${{ matrix.arch }}
          path: tested-image/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  check-debian:
    name: Host scripts (Debian sh)
    needs: source
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false
      - name: Install host check dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash python3 shellcheck docker-cli docker-compose
      - name: Check host scripts with Debian sh
        run: sh build/tests/check.sh

  check-macos:
    name: Host scripts (macOS sh)
    needs: source
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false
      - name: Install host check dependencies
        run: |
          brew install python shellcheck docker docker-compose
          mkdir -p "$RUNNER_TEMP/docker-config/cli-plugins"
          ln -s "$(brew --prefix)/bin/docker-compose" "$RUNNER_TEMP/docker-config/cli-plugins/docker-compose"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - name: Check host scripts with macOS sh
        run: sh build/tests/check.sh

  push:
    name: Push tested image (${{ matrix.arch }})
    needs: [source, test, check-debian, check-macos]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-image-${{ matrix.arch }}
          path: tested-image
      - name: Push tested image by digest
        env:
          REPOSITORY: ${{ github.repository }}
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          image="ghcr.io/${REPOSITORY,,}"
          digest=$(cat tested-image/digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$(skopeo manifest-digest tested-image/image/manifest.json)" == "$digest" ]]
          staging=$(mktemp -d)
          trap 'rm -rf -- "$staging"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$staging/auth.json" \
            ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p digests
          skopeo copy --preserve-digests --authfile "$staging/auth.json" \
            --digestfile "digests/$ARCH" dir:tested-image/image "docker://$image@$digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: [source, push]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false
      - name: Derive image name from repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.source.outputs.tag }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Check rebuilt release is still latest
        if: needs.source.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          [[ "$latest" == "$RELEASE_TAG" ]] || {
            echo "Latest release changed during testing; refusing to publish the older rebuild." >&2
            exit 1
          }
      - name: Publish tested manifests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] || args+=(--tag "$tag")
          done <<< "$TAGS"
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "digests/$arch")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
      - name: Published image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          printf '%s\n' "Published image: $IMAGE_NAME" \
            'Available image tags:' \
            "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"
