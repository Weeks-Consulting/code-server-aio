name: Promote release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    name: Promote tested release to latest
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Serialize with image publication, including weekly security rebuilds.
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      packages: write
    steps:
      - name: Require a release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != tag ]]; then
            echo 'Select a release tag under Run workflow; branches cannot be promoted.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote existing image and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export IMAGE="ghcr.io/${REPOSITORY,,}"
          bash build/ci/release.sh promote-release
