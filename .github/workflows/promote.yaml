name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tested release tag to promote to latest (e.g. v4.141.0-1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Promote tested release to latest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Serialize with image publication, including weekly security rebuilds.
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote existing image and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          export IMAGE="ghcr.io/${REPOSITORY,,}"
          bash build/ci/release.sh promote-release
