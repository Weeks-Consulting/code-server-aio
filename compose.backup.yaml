# Optional overlay: docker compose -f compose.yaml -f compose.backup.yaml up -d
services:
  code-server:
    labels:
      docker-volume-backup.stop-during-backup: ${COMPOSE_PROJECT_NAME}-home

  backup:
    image: offen/docker-volume-backup:v2@sha256:49fcfb2bdc6194ed4d7563d5ede75ff94f3a7435d15cbebae2ef816627944831
    # Root reads files belonging to every archived UID/GID.
    user: "0:0"
    restart: unless-stopped
    environment:
      GPG_PASSPHRASE: ${BACKUP_GPG_PASSPHRASE:?Run the installer or manage to generate a backup encryption key in .env}
      TZ: ${BACKUP_TIMEZONE:-America/Chicago}
      BACKUP_CRON_EXPRESSION: ${BACKUP_CRON_EXPRESSION:-0 3 * * *}
      BACKUP_FILENAME: ${BACKUP_ID:-${COMPOSE_PROJECT_NAME}}-home-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_STOP_DURING_BACKUP_LABEL: ${COMPOSE_PROJECT_NAME}-home
      AWS_S3_BUCKET_NAME: ${BACKUP_AWS_S3_BUCKET_NAME:?Set BACKUP_AWS_S3_BUCKET_NAME in .env}
      AWS_S3_PATH: ${BACKUP_AWS_S3_PATH:-${BACKUP_ID:-${COMPOSE_PROJECT_NAME}}/home}
      AWS_ENDPOINT: ${BACKUP_AWS_ENDPOINT:-s3.amazonaws.com}
      AWS_S3_BUCKET_LOOKUP: ${BACKUP_AWS_S3_BUCKET_LOOKUP:-auto}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:?Set BACKUP_AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:?Set BACKUP_AWS_SECRET_ACCESS_KEY in .env}
    volumes:
      - code-server-home:/backup/code-server-home:ro
      # :ro does not restrict Docker API access; this container controls the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
