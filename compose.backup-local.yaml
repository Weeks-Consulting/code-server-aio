# Local backups: docker compose -f compose.yaml -f compose.backup-local.yaml up -d
services:
  code-server:
    labels:
      docker-volume-backup.stop-during-backup: ${COMPOSE_PROJECT_NAME}-home

  backup:
    image: offen/docker-volume-backup:v2@sha256:49fcfb2bdc6194ed4d7563d5ede75ff94f3a7435d15cbebae2ef816627944831
    # Root reads all archived owners; local copy hooks set the host file owner.
    user: "0:0"
    restart: unless-stopped
    labels:
      docker-volume-backup.exec-label: ${COMPOSE_PROJECT_NAME}-local-home
      docker-volume-backup.copy-pre: >-
        /bin/sh -ec 'chmod 700 /archive;
        chown ${BACKUP_LOCAL_UID:-0}:${BACKUP_LOCAL_GID:-0} /archive'
      docker-volume-backup.copy-post: >-
        /bin/sh -ec 'file="/archive/$${COMMAND_RUNTIME_ARCHIVE_FILEPATH##*/}";
        chown ${BACKUP_LOCAL_UID:-0}:${BACKUP_LOCAL_GID:-0} "$$file";
        chmod 600 "$$file"'
    environment:
      GPG_PASSPHRASE: ${BACKUP_GPG_PASSPHRASE:?Run the installer or manage to generate a backup encryption key in .env}
      TZ: ${BACKUP_TIMEZONE:-America/Chicago}
      EXEC_LABEL: ${COMPOSE_PROJECT_NAME}-local-home
      BACKUP_CRON_EXPRESSION: ${BACKUP_CRON_EXPRESSION:-0 3 * * *}
      BACKUP_FILENAME: ${BACKUP_ID:-${COMPOSE_PROJECT_NAME}}-home-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_STOP_DURING_BACKUP_LABEL: ${COMPOSE_PROJECT_NAME}-home
    volumes:
      - code-server-home:/backup/code-server-home:ro
      # :ro does not restrict Docker API access; this container controls the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        source: ${BACKUP_LOCAL_PATH:-./backups}
        target: /archive
        bind:
          create_host_path: true
